<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบใบตัดงบหมายเลขงาน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--p:#5a2a82;--a:#e9a400;--bg:#f5f3f8;--l:#ddd6e6;--t:#231a2e}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Sarabun,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:17px}header small{opacity:.85}
nav{display:flex;gap:2px;background:#fff;border-bottom:3px solid var(--p);overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--p);color:#fff}
main{max-width:860px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--l);border-radius:6px;padding:12px;margin-bottom:12px}
label{display:block;font-size:14px;color:#5b4b6b;margin:8px 0 2px}
input,select{width:100%;padding:8px;border:1px solid #c9bfd6;border-radius:4px;font:inherit;background:#fff}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{grid-template-columns:1fr 1fr 1fr}
.ex{display:grid;grid-template-columns:1.1fr 1fr 1.2fr;gap:6px;align-items:center;margin-top:6px}
button.b{background:var(--p);color:#fff;border:0;border-radius:4px;padding:9px 16px;font:inherit;cursor:pointer}
button.s{background:#fff;color:var(--p);border:1px solid var(--p);border-radius:4px;padding:4px 10px;font:inherit;cursor:pointer}
button.r{color:#b00020;border-color:#b00020}
.info{background:#fff7e0;border-left:4px solid var(--a);padding:8px 10px;margin:8px 0;font-size:14px}
.tot{font-size:20px;font-weight:600;text-align:right;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}
.n{text-align:right;white-space:nowrap}.w{overflow-x:auto}.err{color:#b00020}.mut{color:#7a6b8a;font-size:13px}
.bar{height:6px;background:#eadff3;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.sm{display:flex;gap:18px;flex-wrap:wrap;margin-top:4px}.sm span{display:flex;flex-direction:column;font-size:12px;color:#7a6b8a}.sm b{font-size:15px;color:var(--t);font-weight:600}.sm b.err{color:#b00020}
details.card>summary{cursor:pointer;list-style:none}.net{margin-top:10px;border-top:1px solid var(--l);padding-top:8px}.nh{background:#f5f0fa;border-radius:4px;padding:6px 8px}
.ar{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:4px;padding:6px 8px;border-bottom:1px solid #eee;font-size:14px}.ar a{font-size:12px;color:var(--p);cursor:pointer}
summary.ar{display:grid;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}details.act{border-bottom:1px solid #eee}details.act>summary.ar{border-bottom:0}details.act[open]>summary.ar{background:#faf7fd}
.cnt{font-size:12px;color:var(--p)}.rl{background:#faf7fd;padding:2px 0 6px}.rr{display:grid;grid-template-columns:1.5fr .8fr 1.2fr;gap:4px;padding:6px 8px;font-size:14px;border-top:1px dashed var(--l)}.rr a{font-size:13px;color:var(--p);cursor:pointer}
summary.fh{display:flex;gap:10px;align-items:flex-start;cursor:pointer;list-style:none}.fb{flex:1;min-width:0}
svg.ic{width:34px;height:34px;flex:none;fill:#e9a400}svg.ic.s{width:26px;height:26px;fill:#9a6fc4}svg.ic .fo{display:none}svg.ic .bk{opacity:.75}
details[open]>summary>svg.ic .fc{display:none}details[open]>summary>svg.ic .fo{display:inline}
details.fd{position:relative;margin-top:18px;background:#fff8e6;border:1px solid #ecd6a0;border-radius:0 10px 10px 10px;padding:10px 12px}
details.fd::before{content:"";position:absolute;left:-1px;top:-11px;width:86px;height:11px;background:#fff8e6;border:1px solid #ecd6a0;border-bottom:0;border-radius:8px 8px 0 0}
details.fd[open]{background:#fff}details.fd[open]::before{background:#fff}
details.fd.sub{background:#faf7fd;border-color:var(--l);margin-top:16px;padding:8px 10px;border-radius:0 8px 8px 8px}details.fd.sub::before{width:62px;height:9px;top:-9px;background:#faf7fd;border-color:var(--l)}
details.fd.sub[open]{background:#fff}details.fd.sub[open]::before{background:#fff}
details.fd>details,details.fd>.rl{margin-left:8px}svg.di{width:14px;height:14px;vertical-align:-2px}
#login{max-width:360px;margin:8vh auto;padding:0 12px}
</style></head><body>
<div id="login"><div class="card"><h2 style="margin:0 0 6px;color:var(--p)">ใบตัดงบหมายเลขงาน</h2>
<div class="mut" id="mode"></div>
<label>รหัสพนักงาน</label><input id="lid" inputmode="numeric" autocomplete="username">
<label>PIN (เฉพาะผู้ดูแลระบบ)</label><input id="lpin" type="password" inputmode="numeric">
<p class="err" id="lerr"></p><button class="b" onclick="login()">เข้าสู่ระบบ</button>
<details id="cfg" style="margin-top:14px"><summary class="mut">ตั้งค่าฐานข้อมูล Google Sheets</summary>
<label>Apps Script Web App URL (เว้นว่าง = โหมดทดลองในเครื่อง)</label><input id="api" placeholder="https://script.google.com/macros/s/.../exec">
<button class="s" style="margin-top:6px" onclick="saveApi()">บันทึก URL</button></details></div></div>
<div id="app" hidden><header><div><b>ใบตัดงบหมายเลขงาน</b><br><small id="who"></small></div><button class="s" onclick="logout()">ออก</button></header>
<nav id="nav"></nav><main id="main"></main></div>

 else{const k=Object.keys(A[0]),csv=[k,...A.map(r=>k.map(c=>r[c]))].map(l=>l.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),
  a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='ใบตัดงบ_'+st+'.csv';document.body.appendChild(a);a.click();a.remove()}
 call('log',{act:'export',target:kind+' '+A.length+' รายการ'}).catch(()=>{})}
async function rmW(w){if(!confirm('ลบหมายเลขงาน '+w+' ทั้งหมด? (ประวัติรายการเบิกไม่หาย)'))return;try{await call('prune',{sheet:'wbs',wbs:w,keep:[]});await load();vWbs()}catch(e){alert(e.message)}}
const WK=['wbs','jobName','network','networkName','activity','activityName','plan','base','approvalPct','budget','costElement'];
function fw(i){WK.forEach(k=>$('#w_'+k).value=S.wbs[i][k]||'');scrollTo(0,0)}
async function saveW(){const r={};WK.forEach(k=>r[k]=$('#w_'+k).value.trim());r.budget=r.budget.replace(/,/g,'');r.plan=r.plan.replace(/,/g,'');r.base=r.base.replace(/,/g,'');r.manual=((r.base&&r.budget&&Math.abs(+r.budget-r2(+r.base*(num(r.approvalPct)||100)/100))>0.005)||(r.plan&&r.base&&Math.abs(+r.base-bs(r.plan,DED))>0.005))?'1':'0';
 if(!r.wbs||!/^\d{10}$/.test(r.network)||!/^\d{4}$/.test(r.activity)){$('#werr').textContent='ต้องมี WBS, เลขโครงข่าย 10 หลัก และเลขกิจกรรม 4 หลัก';return}
 r.id=r.wbs+'|'+r.network+'|'+r.activity;try{await call('save',{sheet:'wbs',row:r});await load();vWbs()}catch(e){$('#werr').textContent=e.message}}
function vUsers(){$('#main').innerHTML=`<div class="card"><b>เพิ่ม / แก้ไขผู้ใช้งาน</b><div class="g"><div><label>รหัสพนักงาน</label><input id="u_id" inputmode="numeric"></div><div><label>ชื่อ – สกุล</label><input id="u_name"></div>
 <div><label>สิทธิ์</label><select id="u_role"><option value="user">ผู้ใช้ (ล็อกอินด้วยรหัสพนักงาน)</option><option value="admin">ผู้ดูแลระบบ (ต้องมี PIN)</option></select></div><div><label>PIN (ผู้ดูแล)</label><input id="u_pin" type="password" inputmode="numeric"></div>
 <div><label>สถานะ</label><select id="u_act"><option value="1">ใช้งาน</option><option value="0">ระงับ</option></select></div></div><p class="err" id="uerr"></p><button class="b" onclick="saveU()">บันทึก</button></div>
 <div class="card w"><table><tr><th>รหัส</th><th>ชื่อ</th><th>สิทธิ์</th><th></th></tr>${S.users.map((u,i)=>`<tr><td>${h(u.empId)}</td><td>${h(u.name)}${u.active==='0'?' <span class="mut">(ระงับ)</span>':''}</td><td>${u.role==='admin'?'ผู้ดูแล':'ผู้ใช้'}</td>
 <td class="n"><button class="s" onclick="fu(${i})">แก้ไข</button> ${u.empId==S.user.empId?'':`<button class="s r" onclick="rm('users','${h(u.id)}')">ลบ</button>`}</td></tr>`).join('')}</table></div>`}
function fu(i){const u=S.users[i];$('#u_id').value=u.empId;$('#u_name').value=u.name;$('#u_role').value=u.role;$('#u_act').value=u.active==='0'?'0':'1';scrollTo(0,0)}
async function saveU(){const id=$('#u_id').value.trim(),r={id,empId:id,name:$('#u_name').value.trim(),role:$('#u_role').value,pin:$('#u_pin').value.trim(),active:$('#u_act').value},old=S.users.find(u=>u.empId===id);
 if(!id||!r.name){$('#uerr').textContent='กรอกรหัสพนักงานและชื่อ';return}if(r.role==='admin'&&!r.pin&&!(old&&old.role==='admin')){$('#uerr').textContent='ผู้ดูแลต้องตั้ง PIN';return}
 try{await call('save',{sheet:'users',row:r});await load();vUsers()}catch(e){$('#uerr').textContent=e.message}}

/* ---- นำเข้าไฟล์ ---- */
const KEEP=/^(ค่าแรง|ค่าควบคุมงาน|ค่าขนส่ง|ค่าเบ็ดเตล็ด)/,r2=v=>Math.round(v*100+1e-6)/100,DED=15;
function parseImp(lines){let wbs='',job='',out=[],skip=0;
 for(const l of lines){const s=l.replace(/\s+/g,' '),n=s.match(/(70\d{8})[\s|]+(\d{4})[\s|]+([^|]*?)\s*\|\s*(-?[\d,]*\d(?:\.\d+)?)/);
  const wc=s.match(/\b([A-Z]-\d{2}-[A-Z]-[A-Za-z0-9.\-]+)/);if(n&&wc)wbs=wc[1];
  if(!n){const w=s.match(/\b([A-Z]-\d{2}-[A-Z]-[A-Za-z0-9.\-]+)\s*([^|]*)/);if(w){wbs=w[1];job=w[2].trim();if(/^[\d,.\s]*(THB)?$/.test(job))job='';}continue}
  const nm=n[3].trim();if(!KEEP.test(nm)){skip++;continue}out.push({wbs,jobName:job,network:n[1],activity:n[2],activityName:nm,plan:n[4].replace(/,/g,'')})}
 return{rows:out,skip}}
async function pick(inp){const f=inp.files[0];if(!f)return;const box=$('#imp');box.textContent='กำลังอ่านไฟล์...';
 try{const buf=await f.arrayBuffer();let lines=[];
  if(/\.(xlsx|xls|xlsm)$/i.test(f.name)){const wb=XLSX.read(buf,{type:'array'});wb.SheetNames.forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).forEach(r=>lines.push(r.join(' | '))))}
  else{let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('windows-874').decode(buf)}
   if(/NWA/.test(t)&&t.includes('|'))lines=t.split(/\r?\n/);else{const wb=XLSX.read(t,{type:'string'});wb.SheetNames.forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).forEach(r=>lines.push(r.join(' | '))))}}
  S.imp=parseImp(lines);renderImp()}catch(e){box.innerHTML='<p class="err">อ่านไฟล์ไม่สำเร็จ: '+h(e.message)+'</p>'}}
const pcts=()=>{const a=num($('#i_ap').value);return[a>0?a:100,DED]},bs=p=>r2(num(p)/1.15),calc=(p,a,d)=>r2(bs(p,d)*a/100);
function impCalc(){if(S.imp)renderImp()}
function renderImp(){const r=S.imp,box=$('#imp');if(!r.rows.length){box.innerHTML='<p class="err">ไม่พบรายการที่นำเข้าได้ในไฟล์นี้</p>';return}const[a,d]=pcts();
 box.innerHTML=`<div class="info">พบ ${r.rows.length} รายการที่จะนำเข้า · ข้าม ${r.skip} รายการ<br>WBS: ${h(r.rows[0].wbs||'ไม่พบในไฟล์ (จะถามตอนยืนยัน)')} · อนุมัติ ${a}%</div><div class="w"><table><tr><th>โครงข่าย</th><th>กิจกรรม</th><th class="n">แผน SAP</th><th class="n">งบประมาณ 100%</th><th class="n">อนุมัติ ${a}%</th></tr>${r.rows.map(x=>`<tr><td>${x.network}</td><td>${x.activity} ${h(x.activityName)}</td><td class="n">${fm(x.plan)}</td><td class="n">${fm(bs(x.plan,d))}</td><td class="n"><b>${fm(calc(x.plan,a,d))}</b></td></tr>`).join('')}<tr><td colspan="2"><b>รวม</b></td><td class="n">${fm(r.rows.reduce((s,x)=>s+num(x.plan),0))}</td><td class="n">${fm(r.rows.reduce((s,x)=>s+bs(x.plan,d),0))}</td><td class="n"><b>${fm(r.rows.reduce((s,x)=>s+calc(x.plan,a,d),0))}</b></td></tr></table></div><button class="b" style="margin-top:8px" onclick="doImp()">ยืนยันนำเข้า</button>`}
async function doImp(){let R=S.imp.rows;const[a,d]=pcts(),w0=R.find(r=>r.wbs);let def=w0?w0.wbs:'';if(R.some(r=>!r.wbs)&&!def){def=(prompt('ไม่พบรหัส WBS ในไฟล์ — ใส่ WBS')||'').trim();if(!def)return}
 R=R.map(r=>({...r,wbs:r.wbs||def}));const ws=uniq(R.map(r=>r.wbs));
 if(!confirm('นำเข้า '+R.length+' รายการ ของ '+ws.join(', ')+'\nอนุมัติ '+a+'%\nข้อมูลหมายเลขงานเดิมของ WBS นี้จะถูกแทนที่ (รวมงบที่เคยแก้เอง · ประวัติรายการเบิกไม่หาย)'))return;
 try{for(const w of ws){const G=R.filter(r=>r.wbs===w).map(r=>{const id=w+'|'+r.network+'|'+r.activity,ex=S.wbs.find(q=>q.id===id);
   return{id,wbs:w,jobName:(S.wbs.find(q=>q.wbs===w&&q.jobName)||{}).jobName||r.jobName,network:r.network,networkName:(S.wbs.find(q=>q.network===r.network&&q.networkName)||{}).networkName||'',activity:r.activity,activityName:r.activityName,plan:r.plan,base:String(bs(r.plan,d)),approvalPct:String(a),manual:'0',budget:String(calc(r.plan,a,d)),costElement:ex?ex.costElement||'':''}});
   for(let i=0;i<G.length;i+=4)await call('save'+'Many',{sheet:'wbs',rows:G.slice(i,i+4)});await call('prune',{sheet:'wbs',wbs:w,keep:G.map(g=>g.id)})}
  await load();vWbs()}catch(e){alert('นำเข้าไม่สำเร็จ: '+e.message)}}

function eb(id){const r=S.wbs.find(w=>w.id===id);if(!r)return;const plan=r.plan||'',base=r.base||(r.plan?String(bs(r.plan,DED)):r.budget)||'',ap=r.approvalPct||'100';
 const o=document.createElement('div');o.id='dlg';o.style.cssText='position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9;overflow:auto';
 o.innerHTML=`<div class="card" style="width:100%;max-width:420px;margin:0"><b>แก้ไขงบประมาณ</b><div class="mut">${h(r.wbs)} · ${h(r.network)} · ${h(r.activity)} ${h(r.activityName)}</div>
 <label>แผน SAP (บาท)</label><input id="e_plan" inputmode="decimal" value="${h(plan)}" oninput="ebCalc('p')">
 <label>งบประมาณ 100% (บาท)</label><input id="e_base" inputmode="decimal" value="${h(base)}" oninput="ebCalc('b')">
 <label>% ที่อนุมัติ</label><input id="e_ap" inputmode="decimal" value="${h(ap)}" oninput="ebCalc('b')">
 <label>งบที่อนุมัติ (บาท) — ใช้เป็นงบของกิจกรรม</label><input id="e_bud" inputmode="decimal" value="${h(r.budget)}">
 <div class="mut">เปลี่ยนค่าด้านบน ระบบคำนวณช่องถัดไปให้ · พิมพ์ตัวเลขทับเองได้ (จะขึ้นป้าย "แก้ไขเอง") · ทุกการแก้ไขถูกบันทึกในประวัติ</div>
 <p class="err" id="eerr"></p><button class="b" onclick="ebSave('${h(id)}')">บันทึก</button> <button class="s" onclick="$('#dlg').remove()">ยกเลิก</button></div>`;document.body.appendChild(o)}
function ebCalc(s){const g=i=>num($('#e_'+i).value);if(s==='p')$('#e_base').value=bs(g('plan'),DED);$('#e_bud').value=r2(g('base')*(g('ap')||100)/100)}
async function ebSave(id){const c=i=>$('#e_'+i).value.replace(/,/g,'').trim(),p=c('plan'),b=c('base'),a=c('ap'),v=c('bud');
 if([b,v].some(x=>x===''||isNaN(+x)||+x<0)||(p!==''&&isNaN(+p))){$('#eerr').textContent='กรอกตัวเลขให้ถูกต้อง';return}
 const man=(Math.abs(+v-r2(+b*(num(a)||100)/100))>0.005||(p!==''&&Math.abs(+b-bs(p,DED))>0.005))?'1':'0';
 try{await call('editBudget',{id,row:{plan:p,base:b,approvalPct:a,budget:v,manual:man}});$('#dlg').remove();await load();go(S.tab)}catch(e){$('#eerr').textContent=e.message}}
